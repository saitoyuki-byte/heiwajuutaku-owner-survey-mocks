<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="平和住宅情報センター様向けプロトタイプ集の表示と進捗を管理します。"
    />
    <title>表示管理｜業務改善システム・プロトタイプ集</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="../" aria-label="プロトタイプ集へ戻る">
          <img
            src="../existing-owner-form-mock/assets/heiwajuutaku-logo.jpg"
            alt="平和住宅情報センター"
          />
          <span></span>
          <strong>プロトタイプ表示管理</strong>
        </a>
        <a class="gallery-link" href="../" target="_blank" rel="noopener">
          一覧を確認 <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <main>
      <section class="workspace-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">PROTOTYPE CONTROL DESK</p>
          <h1 id="page-title">表示と進捗を整える</h1>
          <p class="lead">
            ステータスを選ぶだけで、プロトタイプ集の色・件数・絞り込みへ反映されます。
          </p>
        </div>
        <div class="save-state" role="status" aria-live="polite">
          <i aria-hidden="true"></i>
          <div><strong data-save-label>この端末に保存済み</strong><span data-updated-label>初期設定</span></div>
        </div>
      </section>

      <section class="summary-panel" aria-label="進捗サマリー">
        <div class="summary-intro">
          <span>掲載中</span>
          <strong><b data-visible-total>0</b><small> / <span data-project-capacity>19</span>件</small></strong>
          <div class="summary-bar" data-summary-bar></div>
        </div>
        <div class="summary-statuses" data-summary-statuses></div>
      </section>

      <section class="toolbar" aria-label="プロジェクトの検索と絞り込み">
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <input type="search" placeholder="プロジェクト名で検索" data-search />
        </label>
        <label class="filter-field">
          <span>ステータス</span>
          <select data-status-filter>
            <option value="all">すべて</option>
          </select>
        </label>
        <label class="filter-field">
          <span>カテゴリー</span>
          <select data-category-filter>
            <option value="all">すべて</option>
          </select>
        </label>
        <button class="secondary-button" type="button" data-export>設定を書き出す</button>
        <label class="secondary-button file-button">
          設定を読み込む
          <input type="file" accept="application/json,.json" data-import />
        </label>
      </section>

      <div class="result-meta">
        <p><strong data-result-count>0</strong>件を表示</p>
        <p>変更は自動保存されます</p>
      </div>

      <section class="project-list" aria-label="プロジェクト一覧" data-project-list></section>

      <section class="empty-state" hidden data-empty>
        <strong>該当するプロジェクトがありません</strong>
        <span>検索語か絞り込み条件を変更してください。</span>
      </section>

      <section class="data-note" aria-labelledby="storage-title">
        <div>
          <strong id="storage-title">この管理ページの保存範囲</strong>
          <p>
            設定はこのブラウザにだけ保存されます。別の端末へ移す場合は「設定を書き出す」と
            「設定を読み込む」を使ってください。
          </p>
        </div>
        <button class="reset-button" type="button" data-reset>初期設定に戻す</button>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true" hidden data-toast></div>

    <template id="project-row-template">
      <article class="project-row">
        <div class="project-identity">
          <span class="status-marker" aria-hidden="true"></span>
          <div>
            <span class="category-label"></span>
            <h2></h2>
          </div>
        </div>
        <label class="control status-control">
          <span>ステータス</span>
          <select data-field="status"></select>
        </label>
        <label class="control note-control">
          <span>一覧に表示するメモ</span>
          <input data-field="note" maxlength="120" placeholder="例：10月運用開始予定" />
        </label>
        <div class="toggle-controls">
          <label class="toggle-control">
            <input type="checkbox" data-field="priority" />
            <span class="switch" aria-hidden="true"></span>
            <span><strong>優先表示</strong><small>カテゴリー内の先頭へ</small></span>
          </label>
          <label class="toggle-control">
            <input type="checkbox" data-field="visible" />
            <span class="switch" aria-hidden="true"></span>
            <span><strong>一覧に掲載</strong><small data-visibility-label>表示中</small></span>
          </label>
        </div>
      </article>
    </template>

    <script src="../assets/project-state.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
